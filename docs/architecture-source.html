<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 15px; fill: #64748b; }
  .h { font-size: 17px; font-weight: 650; }
  .s { font-size: 13.5px; }
  .chip { font-size: 13px; font-weight: 600; }
  .lbl { font-size: 12.5px; fill: #475569; font-weight: 600; }
  .sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #94a3b8; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="990" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" class="title">TalentFlow architecture</text>
  <text x="40" y="78" class="subtitle">AI agents do the work; people make every decision. Nothing is emailed or dialed without a recruiter's click.</text>

  <!-- Section labels -->
  <text x="40" y="122" class="sec">PLATFORM</text>
  <text x="1200" y="122" class="sec">OUTSIDE WORLD</text>
  <line x1="1175" y1="110" x2="1175" y2="870" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Row A: people -> web app -> API -->
  <g>
    <rect x="40" y="135" width="250" height="78" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="60" y="167" class="h" fill="#9a3412">Recruiters &amp; managers</text>
    <text x="60" y="191" class="s" fill="#9a3412">Review, approve, send, call</text>

    <rect x="340" y="135" width="360" height="78" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="360" y="167" class="h" fill="#3730a3">Web app · React</text>
    <text x="360" y="191" class="s" fill="#4338ca">Pipeline board · approvals · calls · AI job drafts</text>

    <rect x="750" y="135" width="400" height="78" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="770" y="167" class="h" fill="#3730a3">API · FastAPI</text>
    <text x="770" y="191" class="s" fill="#4338ca">Sign-in &amp; roles · validation · audit log · intake webhook</text>

    <line x1="290" y1="174" x2="336" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="700" y1="174" x2="746" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- Row B: orchestrator with pipeline -->
  <g>
    <line x1="950" y1="213" x2="950" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="255" width="1110" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="285" class="h" fill="#0f172a">Orchestrator · pipeline state machine</text>
    <text x="395" y="285" class="s" fill="#64748b">agents never change a stage themselves; every move is validated and logged</text>

    <!-- chips: 10 stages, width 94, step 109 -->
    <g class="chip">
      <rect x="58" y="305" width="94" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="105" y="325" text-anchor="middle" fill="#334155">Sourced /</text>
      <text x="105" y="341" text-anchor="middle" fill="#334155">applied</text>
      <rect x="167" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="214" y="332" text-anchor="middle" fill="#047857">Screening</text>
      <rect x="276" y="305" width="94" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="323" y="325" text-anchor="middle" fill="#92400e">You:</text>
      <text x="323" y="341" text-anchor="middle" fill="#92400e">advance?</text>
      <rect x="385" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="432" y="332" text-anchor="middle" fill="#047857">Outreach</text>
      <rect x="494" y="305" width="94" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="541" y="332" text-anchor="middle" fill="#334155">Contacted</text>
      <rect x="603" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="650" y="332" text-anchor="middle" fill="#047857">Scheduling</text>
      <rect x="712" y="305" width="94" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="759" y="332" text-anchor="middle" fill="#334155">Interview</text>
      <rect x="821" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="868" y="332" text-anchor="middle" fill="#047857">Evaluation</text>
      <rect x="930" y="305" width="94" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="977" y="325" text-anchor="middle" fill="#92400e">You:</text>
      <text x="977" y="341" text-anchor="middle" fill="#92400e">offer?</text>
      <rect x="1039" y="305" width="94" height="44" rx="8" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1086" y="332" text-anchor="middle" fill="#166534">Offer</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)">
      <line x1="152" y1="327" x2="164" y2="327"/>
      <line x1="261" y1="327" x2="273" y2="327"/>
      <line x1="370" y1="327" x2="382" y2="327"/>
      <line x1="479" y1="327" x2="491" y2="327"/>
      <line x1="588" y1="327" x2="600" y2="327"/>
      <line x1="697" y1="327" x2="709" y2="327"/>
      <line x1="806" y1="327" x2="818" y2="327"/>
      <line x1="915" y1="327" x2="927" y2="327"/>
      <line x1="1024" y1="327" x2="1036" y2="327"/>
    </g>
  </g>

  <!-- Row C: task queue -->
  <g>
    <line x1="595" y1="373" x2="595" y2="405" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="409" width="1110" height="62" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="60" y="438" class="h" fill="#3730a3">Durable task queue + workers</text>
    <text x="60" y="459" class="s" fill="#4338ca">Saved with the stage change · retries with backoff · crash recovery · scheduled inbox checks · scale out safely (SKIP LOCKED)</text>
  </g>

  <!-- Row D: agents, two rows of four -->
  <g>
    <line x1="595" y1="471" x2="595" y2="503" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <text x="40" y="498" class="sec">AI AGENTS (CLAUDE)</text>
    <g>
      <rect x="40" y="507" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="56" y="535" class="h" fill="#065f46">Intake</text>
      <text x="56" y="559" class="s" fill="#047857">Portal emails + webhook pushes</text>
      <text x="56" y="579" class="s" fill="#047857">→ matched to the right open job</text>

      <rect x="321" y="507" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="337" y="535" class="h" fill="#065f46">Job writer</text>
      <text x="337" y="559" class="s" fill="#047857">A few words → full job posting</text>
      <text x="337" y="579" class="s" fill="#047857">for the recruiter to review</text>

      <rect x="602" y="507" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="618" y="535" class="h" fill="#065f46">Sourcing</text>
      <text x="618" y="559" class="s" fill="#047857">Finds matches in the talent pool</text>
      <text x="618" y="579" class="s" fill="#047857">by meaning + keyword, whole resume</text>

      <rect x="883" y="507" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="899" y="535" class="h" fill="#065f46">Screening</text>
      <text x="899" y="559" class="s" fill="#047857">Scores each requirement</text>
      <text x="899" y="579" class="s" fill="#047857">with evidence from the resume</text>

      <rect x="40" y="613" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="56" y="641" class="h" fill="#065f46">Outreach</text>
      <text x="56" y="665" class="s" fill="#047857">Personal email draft</text>
      <text x="56" y="685" class="s" fill="#047857">sent on a recruiter's click</text>

      <rect x="321" y="613" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="337" y="641" class="h" fill="#065f46">Scheduling</text>
      <text x="337" y="665" class="s" fill="#047857">Free slots + invitation</text>
      <text x="337" y="685" class="s" fill="#047857">Teams meeting booked</text>

      <rect x="602" y="613" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="618" y="641" class="h" fill="#065f46">Evaluation</text>
      <text x="618" y="665" class="s" fill="#047857">Scorecard from</text>
      <text x="618" y="685" class="s" fill="#047857">interview notes</text>

      <rect x="883" y="613" width="267" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="899" y="641" class="h" fill="#065f46">Calling agent</text>
      <text x="899" y="665" class="s" fill="#047857">Pre-screen · schedule</text>
      <text x="899" y="685" class="s" fill="#047857">· reminder calls</text>
    </g>
  </g>

  <!-- Row E: data -->
  <g>
    <line x1="460" y1="705" x2="460" y2="751" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="470" y="733" class="lbl">read / write</text>
    <rect x="40" y="755" width="560" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="784" class="h" fill="#0f172a">PostgreSQL + pgvector · all records</text>
    <text x="60" y="806" class="s" fill="#334155">Candidates · jobs · pipeline · emails · calls · event log · tasks</text>
    <text x="60" y="826" class="s" fill="#334155">Resume pieces (HNSW vector index) · full-text keyword index</text>

    <rect x="640" y="755" width="250" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="660" y="784" class="h" fill="#0f172a">Embeddings</text>
    <text x="660" y="806" class="s" fill="#334155">fastembed (local, default)</text>
    <text x="660" y="826" class="s" fill="#334155">or Voyage AI (hosted)</text>
    <line x1="640" y1="797" x2="604" y2="797" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="910" y="755" width="240" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="930" y="784" class="h" fill="#0f172a">Resume files</text>
    <text x="930" y="806" class="s" fill="#334155">Original PDF / DOCX</text>
    <text x="930" y="826" class="s" fill="#334155">Local volume or S3 / R2</text>
  </g>

  <!-- Right column: outside world -->
  <g>
    <!-- Candidates -->
    <rect x="1200" y="135" width="360" height="78" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="1220" y="167" class="h" fill="#9a3412">Candidates</text>
    <text x="1220" y="191" class="s" fill="#9a3412">Apply on portals · get emails, invites, AI calls</text>

    <!-- Job portals -->
    <rect x="1200" y="255" width="360" height="92" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <text x="1220" y="286" class="h" fill="#115e59">Job portals</text>
    <text x="1220" y="310" class="s" fill="#0f766e">Naukri · LinkedIn · Indeed · careers page</text>
    <text x="1220" y="330" class="s" fill="#0f766e">Email each application with the resume</text>
    <line x1="1300" y1="213" x2="1300" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <text x="1308" y="238" class="lbl">apply</text>

    <!-- Webhook: portals and tools push applications to the API -->
    <path d="M1200,275 L1165,275 L1165,200 L1154,200" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="1161" y="232" class="lbl" text-anchor="end">webhook</text>

    <!-- Microsoft 365 -->
    <rect x="1200" y="387" width="360" height="92" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="1220" y="418" class="h" fill="#1e3a8a">Microsoft 365 · Graph</text>
    <text x="1220" y="442" class="s" fill="#1d4ed8">Outlook email · free/busy · Teams invites</text>
    <text x="1220" y="462" class="s" fill="#1d4ed8">Intake mailbox (read-only)</text>
    <line x1="1380" y1="347" x2="1380" y2="383" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <text x="1388" y="370" class="lbl">applications by email</text>

    <!-- Twilio -->
    <rect x="1200" y="519" width="360" height="92" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="1220" y="550" class="h" fill="#991b1b">Twilio Voice</text>
    <text x="1220" y="574" class="s" fill="#b91c1c">Phone calls · speech ↔ text</text>
    <text x="1220" y="594" class="s" fill="#b91c1c">(ConversationRelay, live stream)</text>

    <!-- Emails, invites, and calls reach candidates -->
    <path d="M1560,565 L1582,565 L1582,174 L1564,174" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="1560" y1="433" x2="1582" y2="433" stroke="#64748b" stroke-width="2"/>

    <!-- Claude -->
    <rect x="1200" y="651" width="360" height="92" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1220" y="682" class="h" fill="#5b21b6">Claude · Anthropic API</text>
    <text x="1220" y="706" class="s" fill="#6d28d9">Every agent · structured outputs</text>
    <text x="1220" y="726" class="s" fill="#6d28d9">Opus 5 by default, per-agent models</text>

    <!-- arrows platform <-> outside -->
    <line x1="1150" y1="440" x2="1196" y2="440" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M1150,640 L1172,640 L1172,572 L1196,572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="1150" y1="690" x2="1196" y2="690" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(40,880)">
    <rect x="0" y="0" width="1520" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="24" y="26" width="22" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="56" y="43" class="s" fill="#334155">Human decision (approval gate)</text>
    <rect x="290" y="26" width="22" height="22" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="322" y="43" class="s" fill="#334155">AI agent</text>
    <rect x="410" y="26" width="22" height="22" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="442" y="43" class="s" fill="#334155">New agent</text>
    <rect x="540" y="26" width="22" height="22" rx="5" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="572" y="43" class="s" fill="#334155">Platform</text>
    <rect x="670" y="26" width="22" height="22" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="702" y="43" class="s" fill="#334155">Data</text>
    <text x="780" y="43" class="s" fill="#64748b">Without Microsoft 365 / Twilio, emails are recorded, calls are simulated, and resumes are uploaded by hand.</text>
  </g>
</svg>
</body>
</html>
