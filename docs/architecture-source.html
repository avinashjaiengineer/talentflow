<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 15px; fill: #64748b; }
  .h { font-size: 17px; font-weight: 650; }
  .s { font-size: 13.5px; }
  .chip { font-size: 13px; font-weight: 600; }
  .lbl { font-size: 12.5px; fill: #475569; font-weight: 600; }
  .sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #94a3b8; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" class="title">TalentFlow architecture</text>
  <text x="40" y="78" class="subtitle">AI agents do the work; people make every decision. Nothing is emailed or dialed without a recruiter's click.</text>

  <!-- Section labels -->
  <text x="40" y="122" class="sec">PLATFORM</text>
  <text x="1200" y="122" class="sec">OUTSIDE WORLD</text>
  <line x1="1175" y1="110" x2="1175" y2="820" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Row A: people -> web app -> API -->
  <g>
    <rect x="40" y="135" width="250" height="78" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="60" y="167" class="h" fill="#9a3412">Recruiters &amp; managers</text>
    <text x="60" y="191" class="s" fill="#9a3412">Review, approve, send, call</text>

    <rect x="340" y="135" width="360" height="78" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="360" y="167" class="h" fill="#3730a3">Web app · React</text>
    <text x="360" y="191" class="s" fill="#4338ca">Pipeline board · approvals · calls · emails</text>

    <rect x="750" y="135" width="400" height="78" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="770" y="167" class="h" fill="#3730a3">API · FastAPI</text>
    <text x="770" y="191" class="s" fill="#4338ca">Sign-in &amp; roles · validation · audit log</text>

    <line x1="290" y1="174" x2="336" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="700" y1="174" x2="746" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- Row B: orchestrator with pipeline -->
  <g>
    <line x1="950" y1="213" x2="950" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="255" width="1110" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="285" class="h" fill="#0f172a">Orchestrator · pipeline state machine</text>
    <text x="395" y="285" class="s" fill="#64748b">agents never change a stage themselves; every move is validated and logged</text>

    <!-- chips: 10 stages, width 96, step 109.5 -->
    <g class="chip">
      <rect x="58" y="305" width="94" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="105" y="332" text-anchor="middle" fill="#334155">Sourced</text>
      <rect x="167" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="214" y="332" text-anchor="middle" fill="#047857">Screening</text>
      <rect x="276" y="305" width="94" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="323" y="325" text-anchor="middle" fill="#92400e">You:</text>
      <text x="323" y="341" text-anchor="middle" fill="#92400e">advance?</text>
      <rect x="385" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="432" y="332" text-anchor="middle" fill="#047857">Outreach</text>
      <rect x="494" y="305" width="94" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="541" y="332" text-anchor="middle" fill="#334155">Contacted</text>
      <rect x="603" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="650" y="332" text-anchor="middle" fill="#047857">Scheduling</text>
      <rect x="712" y="305" width="94" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="759" y="332" text-anchor="middle" fill="#334155">Interview</text>
      <rect x="821" y="305" width="94" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="868" y="332" text-anchor="middle" fill="#047857">Evaluation</text>
      <rect x="930" y="305" width="94" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="977" y="325" text-anchor="middle" fill="#92400e">You:</text>
      <text x="977" y="341" text-anchor="middle" fill="#92400e">offer?</text>
      <rect x="1039" y="305" width="94" height="44" rx="8" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1086" y="332" text-anchor="middle" fill="#166534">Offer</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)">
      <line x1="152" y1="327" x2="164" y2="327"/>
      <line x1="261" y1="327" x2="273" y2="327"/>
      <line x1="370" y1="327" x2="382" y2="327"/>
      <line x1="479" y1="327" x2="491" y2="327"/>
      <line x1="588" y1="327" x2="600" y2="327"/>
      <line x1="697" y1="327" x2="709" y2="327"/>
      <line x1="806" y1="327" x2="818" y2="327"/>
      <line x1="915" y1="327" x2="927" y2="327"/>
      <line x1="1024" y1="327" x2="1036" y2="327"/>
    </g>
  </g>

  <!-- Row C: task queue -->
  <g>
    <line x1="595" y1="373" x2="595" y2="405" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="409" width="1110" height="62" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="60" y="438" class="h" fill="#3730a3">Durable task queue + workers</text>
    <text x="60" y="459" class="s" fill="#4338ca">Saved with the stage change · retries with backoff · crash recovery · scale out safely (SKIP LOCKED)</text>
  </g>

  <!-- Row D: agents -->
  <g>
    <line x1="595" y1="471" x2="595" y2="503" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <text x="40" y="498" class="sec">AI AGENTS (CLAUDE)</text>
    <g>
      <rect x="40" y="507" width="174" height="96" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="56" y="536" class="h" fill="#065f46">Sourcing</text>
      <text x="56" y="560" class="s" fill="#047857">Finds matches</text>
      <text x="56" y="580" class="s" fill="#047857">by meaning</text>

      <rect x="227" y="507" width="174" height="96" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="243" y="536" class="h" fill="#065f46">Screening</text>
      <text x="243" y="560" class="s" fill="#047857">Scores each</text>
      <text x="243" y="580" class="s" fill="#047857">requirement + evidence</text>

      <rect x="414" y="507" width="174" height="96" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="430" y="536" class="h" fill="#065f46">Outreach</text>
      <text x="430" y="560" class="s" fill="#047857">Personal email</text>
      <text x="430" y="580" class="s" fill="#047857">draft</text>

      <rect x="601" y="507" width="174" height="96" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="617" y="536" class="h" fill="#065f46">Scheduling</text>
      <text x="617" y="560" class="s" fill="#047857">Free slots +</text>
      <text x="617" y="580" class="s" fill="#047857">invitation</text>

      <rect x="788" y="507" width="174" height="96" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="804" y="536" class="h" fill="#065f46">Evaluation</text>
      <text x="804" y="560" class="s" fill="#047857">Scorecard from</text>
      <text x="804" y="580" class="s" fill="#047857">interview notes</text>

      <rect x="975" y="507" width="175" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="991" y="536" class="h" fill="#065f46">Calling agent</text>
      <text x="991" y="560" class="s" fill="#047857">Pre-screen · schedule</text>
      <text x="991" y="580" class="s" fill="#047857">· reminder calls</text>
    </g>
  </g>

  <!-- Row E: data -->
  <g>
    <line x1="400" y1="603" x2="400" y2="651" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="410" y="632" class="lbl">read / write</text>
    <rect x="40" y="655" width="720" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="688" class="h" fill="#0f172a">PostgreSQL + pgvector · shared state</text>
    <text x="60" y="714" class="s" fill="#334155">Candidates · jobs · embeddings · approvals · emails · calls &amp; transcripts · event log · tasks</text>

    <rect x="800" y="655" width="350" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="820" y="688" class="h" fill="#0f172a">Local embeddings</text>
    <text x="820" y="714" class="s" fill="#334155">fastembed (bge-small), no API key</text>
    <line x1="800" y1="697" x2="764" y2="697" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- Right column: outside world -->
  <g>
    <!-- Candidates -->
    <rect x="1200" y="135" width="360" height="78" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="1220" y="167" class="h" fill="#9a3412">Candidates</text>
    <text x="1220" y="191" class="s" fill="#9a3412">Receive emails, Teams invites, AI calls</text>

    <!-- Microsoft 365 -->
    <rect x="1200" y="255" width="360" height="92" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="1220" y="286" class="h" fill="#1e3a8a">Microsoft 365 · Graph</text>
    <text x="1220" y="310" class="s" fill="#1d4ed8">Outlook email · calendar free/busy</text>
    <text x="1220" y="330" class="s" fill="#1d4ed8">Teams meetings + invitations</text>
    <line x1="1380" y1="255" x2="1380" y2="217" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <!-- Twilio -->
    <rect x="1200" y="387" width="360" height="92" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="1220" y="418" class="h" fill="#991b1b">Twilio Voice</text>
    <text x="1220" y="442" class="s" fill="#b91c1c">Phone calls · speech ↔ text</text>
    <text x="1220" y="462" class="s" fill="#b91c1c">(ConversationRelay, live stream)</text>
    <path d="M1560,433 L1582,433 L1582,174 L1564,174" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <!-- Claude -->
    <rect x="1200" y="519" width="360" height="92" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1220" y="550" class="h" fill="#5b21b6">Claude · Anthropic API</text>
    <text x="1220" y="574" class="s" fill="#6d28d9">Every agent · structured outputs</text>
    <text x="1220" y="594" class="s" fill="#6d28d9">Opus 5 by default, per-agent models</text>

    <!-- arrows platform -> outside -->
    <line x1="1150" y1="555" x2="1196" y2="555" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="1150" y1="425" x2="1196" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M1150,530 L1172,530 L1172,440 L1196,440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(40,780)">
    <rect x="0" y="0" width="1520" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="24" y="26" width="22" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="56" y="43" class="s" fill="#334155">Human decision (approval gate)</text>
    <rect x="310" y="26" width="22" height="22" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="342" y="43" class="s" fill="#334155">AI agent step</text>
    <rect x="490" y="26" width="22" height="22" rx="5" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="522" y="43" class="s" fill="#334155">Platform</text>
    <rect x="630" y="26" width="22" height="22" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="662" y="43" class="s" fill="#334155">Data</text>
    <text x="760" y="43" class="s" fill="#64748b">Without Microsoft 365 / Twilio, emails are recorded and calls are simulated in the app: nothing leaves TalentFlow.</text>
  </g>
</svg>
</body>
</html>
