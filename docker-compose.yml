# Local / single-machine setup: Postgres + pgvector, API, and agent worker.
# For a public server use deploy/docker-compose.prod.yml (adds Caddy + HTTPS).
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://talentflow:talentflow@db:5432/talentflow
    EMBEDDED_WORKER: "false"  # the worker service below runs the agents
  volumes:
    - files:/data/files  # original resumes (STORAGE_PROVIDER=local)
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
      POSTGRES_DB: talentflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  files:
